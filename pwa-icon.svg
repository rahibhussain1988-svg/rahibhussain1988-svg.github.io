<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Medical Cross with Shadow -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="208" y="112" width="96" height="288" rx="28" fill="url(#crossGrad)" />
    <!-- Horizontal Cross Bar -->
    <rect x="112" y="208" width="288" height="96" rx="28" fill="url(#crossGrad)" />
  </g>

  <!-- Center Heartbeat / Pulse Accent -->
  <path d="M144 256 H200 L224 200 L256 312 L288 228 L312 256 H368" 
        fill="none" 
        stroke="#059669" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Heart Icon on Cross Top Center -->
  <circle cx="256" cy="156" r="16" fill="#ef4444" />
</svg>
